
name: Build and Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm install

      - name: Test application
        run: npm test

      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            server.js
            package.json
            package-lock.json

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download files
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7E100DFDCC1E4B619BE26BD880710D14 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3C5E1EF2E7924ACB89F50405198BCCA8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_96D16614EF04479CA51EE98A7483D0FF }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: sample-apps
          slot-name: Production
          package: .
