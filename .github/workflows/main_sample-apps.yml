name: Build and Deploy Next.js to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify Next.js production build
        run: |
          test -f frontend/.next/required-server-files.json
          test -f frontend/.next/BUILD_ID
          echo "Next.js production build verified"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Prepare deployment package
        run: |
          mkdir -p backend/frontend
          cp -a frontend/.next backend/frontend/
          cp frontend/package.json backend/frontend/
          cp -a frontend/node_modules backend/frontend/

          test -f backend/server.js
          test -f backend/frontend/.next/required-server-files.json

          cd backend
          zip -qr ../app.zip .

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: app.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7E100DFDCC1E4B619BE26BD880710D14 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3C5E1EF2E7924ACB89F50405198BCCA8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_96D16614EF04479CA51EE98A7483D0FF }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: sample-apps
          slot-name: Production
          package: deploy/app.zip
