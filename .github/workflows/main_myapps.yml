
name: Build and deploy Next.js + Node.js to Azure - myapps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js frontend
        run: npm run build

      - name: Test production server startup
        run: |
          test -f .next/BUILD_ID
          test -f backend/server.js
          node --check backend/server.js

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp -r .next deploy/.next
          cp -r public deploy/public
          cp -r backend deploy/backend
          cp package.json deploy/package.json
          cp package-lock.json deploy/package-lock.json
          cp next.config.ts deploy/next.config.ts
          cd deploy
          npm ci --omit=dev

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: myapps
          slot-name: Production
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_ABC43CC5DAE9429B907A70774F416978 }}
          package: deploy
