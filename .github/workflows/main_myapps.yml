
name: Deploy myapps to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build app
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Prepare deployment
        run: |
          mkdir deploy
          cp -r frontend/.next deploy/.next
          cp -r frontend/app deploy/app
          cp -r backend deploy/backend
          cp frontend/package.json deploy/package.json
          cp frontend/next.config.ts deploy/next.config.ts
          cd deploy
          npm install --omit=dev

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: myapps
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_ABC43CC5DAE9429B907A70774F416978 }}
          package: deploy
